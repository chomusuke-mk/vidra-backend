name: Release Vidra Backend

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag de la versión para el release (ej. v1.0.0)"
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Compilar y empaquetar
        run: |
          cd src

          python -m compileall .

          zip -r ../app.zip .

          cd ..

      - name: Crear Release y subir app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.event.inputs.version }}" \
            --title "Vidra Backend ${{ github.event.inputs.version }}" \
            --generate-notes \
            app.zip
